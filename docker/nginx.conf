# nginx configuration for the Barista static site.
#
# Three things matter here: the SPA fallback, correct cache headers, and serving
# WebAssembly with the right MIME type.
#
# Security headers live in security-headers.inc and are included per location
# rather than set once at server level. nginx replaces inherited add_header
# directives instead of merging them, so any location setting a cache header
# would otherwise silently drop them. Verified by test, not assumed.

server {
    # nginx-unprivileged listens on 8080 as a non-root user.
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Tree-sitter ships its Java grammar and runtime as WebAssembly. Browsers
    # refuse to stream-compile a .wasm response served as octet-stream, so the
    # type has to be explicit. Recent nginx builds include this in mime.types,
    # but the parser silently falls back to a slower path when it is missing and
    # that is a miserable thing to debug.
    types {
        application/wasm  wasm;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/wasm
                      image/svg+xml;

    # Hashed build artefacts are immutable: the filename changes when the
    # content does, so they can be cached indefinitely.
    #
    # The pattern is quoted because nginx reads a bare `{` as the start of a
    # block, so an unquoted `{8,}` quantifier fails to parse.
    #
    # Cache-Control is written in full rather than combined with `expires`,
    # which would emit a second, conflicting Cache-Control header.
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|wasm)$" {
        include    /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Unhashed assets, including the tree-sitter .wasm files, get a short cache
    # with revalidation.
    location ~* "\.(wasm|woff2?|png|jpg|jpeg|gif|svg|ico)$" {
        include    /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # index.html is never cached. It is the file that points at every hashed
    # asset, so a stale copy pins the whole app to an old build.
    location = /index.html {
        include    /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback: unknown paths are client-side routes, not 404s.
    location / {
        include   /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    # Keep noise out of the log for a file browsers request unprompted.
    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }
}
